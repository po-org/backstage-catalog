apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: feature-flag-example
  title: Feature Flag Example
  description: Show/hide parameters based on feature flags
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Standard Configuration
      properties:
        name:
          type: string
          title: Name
    
    - title: Experimental Features
      description: Only visible when feature flag is enabled
      backstage:featureFlag: experimental-scaffolder
      properties:
        experimentalOption:
          type: string
          title: Experimental Option
          backstage:featureFlag: nested-experimental
          description: Nested feature flag example