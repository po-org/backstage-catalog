apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: entitytagspicker-example
  title: EntityTagsPicker Feature
  description: Select tags from existing catalog entities
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Tag Selection
      properties:
        componentTags:
          title: Component Tags
          type: array
          description: Select tags used in existing components
          ui:field: EntityTagsPicker
          ui:help: 'Shows all tags currently used in the catalog'
        
        serviceTags:
          title: Service Tags
          type: array
          description: Tags from service-type components
          ui:field: EntityTagsPicker
          ui:options:
            kind: Component
            catalogFilter:
              spec.type: service
          ui:help: 'Only tags from service components'
        
        customTags:
          title: Custom Tags
          type: array
          description: Add your own tags or select existing ones
          ui:field: EntityTagsPicker
          ui:options:
            allowArbitraryValues: true
          ui:help: 'You can type custom tags not in the catalog'
  
  steps:
    - id: log
      name: Log Tags
      action: debug:log
      input:
        message: |
          Component Tags: ${{ parameters.componentTags }}
          Service Tags: ${{ parameters.serviceTags }}
          Custom Tags: ${{ parameters.customTags }}