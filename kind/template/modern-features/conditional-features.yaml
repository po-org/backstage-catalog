apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: complex-dependencies-example
  title: Complex Conditional Dependencies
  description: Advanced conditional logic with allOf/anyOf
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Deployment Configuration
      properties:
        deploymentType:
          title: Deployment Type
          type: string
          enum:
            - kubernetes
            - docker
            - vm
            - serverless
          default: kubernetes
        
        environment:
          title: Environment
          type: string
          enum:
            - development
            - staging
            - production
          default: development
        
        # Shows when deploymentType is kubernetes OR docker
        containerRegistry:
          title: Container Registry
          type: string
          description: Registry for container images
          default: docker.io
        
        # Shows when deploymentType is kubernetes AND environment is production
        highAvailability:
          title: Enable High Availability
          type: boolean
          description: Enable HA configuration
          default: false
        
        # Shows when environment is production (any deployment type)
        backupEnabled:
          title: Enable Backups
          type: boolean
          description: Enable automated backups
          default: true
        
        # Complex: Shows when (kubernetes AND production) OR (docker AND staging)
        advancedMonitoring:
          title: Advanced Monitoring
          type: object
          properties:
            prometheusEnabled:
              type: boolean
              title: Enable Prometheus
            grafanaEnabled:
              type: boolean
              title: Enable Grafana
      
      dependencies:
        deploymentType:
          # anyOf: containerRegistry shows for kubernetes OR docker
          anyOf:
            - properties:
                deploymentType:
                  enum: [kubernetes, docker]
              required: [containerRegistry]
        
        # allOf: highAvailability requires BOTH conditions
        environment:
          allOf:
            - if:
                properties:
                  deploymentType:
                    const: kubernetes
                  environment:
                    const: production
              then:
                required: [highAvailability]
        
        # Simple dependency: backupEnabled for production
        environment:
          oneOf:
            - properties:
                environment:
                  const: production
              required: [backupEnabled]
        
        # Complex nested dependency
        deploymentType:
          anyOf:
            - allOf:
                - properties:
                    deploymentType:
                      const: kubernetes
                    environment:
                      const: production
                - required: [advancedMonitoring]
            - allOf:
                - properties:
                    deploymentType:
                      const: docker
                    environment:
                      const: staging
                - required: [advancedMonitoring]
  
  steps:
    - id: log
      name: Log Configuration
      action: debug:log
      input:
        message: |
          Deployment: ${{ parameters.deploymentType }}
          Environment: ${{ parameters.environment }}
          Registry: ${{ parameters.containerRegistry }}
          HA: ${{ parameters.highAvailability }}
          Backups: ${{ parameters.backupEnabled }}