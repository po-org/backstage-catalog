apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: repourlselector-example
  title: RepoUrlSelector Feature
  description: Advanced repository URL selection with constraints
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Repository Configuration
      properties:
        repoUrlSelector:
          title: Repository URL
          type: string
          description: Select repository with advanced options
          ui:field: RepoUrlSelector
          ui:options:
            allowedHosts:
              - github.com
              - gitlab.com
            allowedOwners:
              - my-organization
              - my-team
            allowedRepos:
              - 'frontend-.*'
              - 'backend-.*'
              - 'service-.*'
          ui:help: 'Repository must match allowed patterns'
        
        restrictedRepo:
          title: Restricted Repository
          type: string
          description: Highly restricted repository selection
          ui:field: RepoUrlSelector
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - company-org
            allowedRepos:
              - 'prod-.*'
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
          ui:help: 'Only production repositories allowed'
        
        flexibleRepo:
          title: Flexible Repository
          type: string
          description: More flexible repository options
          ui:field: RepoUrlSelector
          ui:options:
            allowedHosts:
              - github.com
              - gitlab.com
              - bitbucket.org
  
  steps:
    - id: log
      name: Log Repository URLs
      action: debug:log
      input:
        message: |
          Selected Repository: ${{ parameters.repoUrlSelector }}
          Restricted Repo: ${{ parameters.restrictedRepo }}
          Flexible Repo: ${{ parameters.flexibleRepo }}