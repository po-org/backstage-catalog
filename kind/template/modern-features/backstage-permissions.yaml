apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: permissions-example
  title: Template with Permissions
  description: Control access to parameters and steps
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Basic Information
      properties:
        title:
          title: Title
          type: string
    
    - title: Sensitive Information
      properties:
        apiKey:
          title: API Key
          type: string
          ui:field: Secret
          backstage:permissions:
            tags:
              - admin-only
        
        databasePassword:
          title: Database Password
          type: string
          ui:field: Secret
          backstage:permissions:
            tags:
              - admin-only
  
  steps:
    - id: log-basic
      name: Log Basic Info
      action: debug:log
      input:
        message: ${{ parameters.title }}
    
    - id: configure-secrets
      name: Configure Secrets
      action: debug:log
      input:
        message: "Setting up secrets"
      backstage:permissions:
        tags:
          - admin-only