apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: modern-ui-options-example
  title: Modern UI Options
  description: Latest UI configuration options
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Advanced UI Features
      properties:
        # Disabled field
        autoGeneratedId:
          title: Auto-Generated ID
          type: string
          description: This field is automatically generated
          default: "auto-123456"
          ui:disabled: true
          ui:help: 'This field cannot be edited'
        
        # Conditionally disabled
        environment:
          title: Environment
          type: string
          enum: [dev, staging, prod]
          default: dev
        
        productionSettings:
          title: Production Settings
          type: string
          description: Only enabled for production
          ui:disabled: true
          # Would need custom logic to enable based on environment
        
        # Empty value handling
        optionalField:
          title: Optional Field
          type: string
          description: Field with custom empty value
          ui:emptyValue: ""
          ui:placeholder: "Leave empty if not applicable"
        
        nullableField:
          title: Nullable Field
          type: string
          description: Can be explicitly null
          ui:emptyValue: null
        
        # Markdown in description
        richDescription:
          title: Field with Rich Description
          type: string
          description: |
            ## Markdown Support
            
            This field supports **markdown** in descriptions:
            - Item 1
            - Item 2
            - Item 3
            
            [Link to docs](https://example.com)
          ui:options:
            enableMarkdownInDescription: true
          ui:help: 'Markdown is rendered in the description above'
        
        # Field with backdrop/section styling
        criticalSection:
          title: Critical Configuration
          type: object
          description: Important settings that require attention
          ui:options:
            backdrop: true
          properties:
            apiKey:
              type: string
              title: API Key
              ui:field: Secret
            endpoint:
              type: string
              title: API Endpoint
              format: uri
        
        # Order/weight control
        firstField:
          title: First Field
          type: string
          ui:order: 1
        
        thirdField:
          title: Third Field
          type: string
          ui:order: 3
        
        secondField:
          title: Second Field
          type: string
          ui:order: 2
        
        # Column layout (grid)
        firstName:
          title: First Name
          type: string
          ui:col: 6
        
        lastName:
          title: Last Name
          type: string
          ui:col: 6
        
        # Full width
        fullWidthField:
          title: Full Width Field
          type: string
          ui:col: 12
          ui:widget: textarea
        
        # Field with custom CSS class
        styledField:
          title: Styled Field
          type: string
          ui:options:
            className: custom-field-class
        
        # Hidden but submitted
        hiddenTracking:
          title: Hidden Tracking Field
          type: string
          default: "tracking-value"
          ui:widget: hidden
        
        # Readonly with custom formatting
        createdAt:
          title: Created At
          type: string
          default: "2025-12-19T10:00:00Z"
          ui:readonly: true
          ui:options:
            inputType: datetime-local
        
        # Field with inline help icon
        complexField:
          title: Complex Field
          type: string
          description: Short description
          ui:help: |
            Detailed help text that appears in a tooltip or help icon.
            Can be multiple lines.
          ui:helpLink: https://docs.example.com/complex-field
  
  steps:
    - id: log
      name: Log UI Options
      action: debug:log
      input:
        message: |
          All fields: ${{ parameters | dump(2) }}