apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-api-example
  title: GitHub API Integration Example
  description: Template demonstrating GitHub API calls using http:backstage:request
  tags:
    - github
    - api
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: Repository Information
      required:
        - repoName
        - owner
      properties:
        repoName:
          title: Repository Name
          type: string
          description: Name of the GitHub repository
          default: backstage-catalog
        owner:
          title: Repository Owner
          type: string
          description: GitHub username or organization
          default: C-Nell
        description:
          title: Repository Description
          type: string
          description: Description for the repository
          default: "Repository created from Backstage template"
        isPrivate:
          title: Private Repository
          type: boolean
          default: false
  steps:
    - id: get-repo-data
      name: Get Repository Details
      action: http:backstage:request
      input:
        method: "GET"
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          content-type: "application/json"
          Accept: "application/vnd.github.v3+json"

    - id: log_github_debug
      name: Log GitHub Info
      action: debug:log
      input: 
        message: |
          === GitHub API Response ===
          Status: ${{ steps['get-repo-data'].output.code }}
          
          Repository: ${{ steps['get-repo-data'].output.body.full_name }}
          Private: ${{ steps['get-repo-data'].output.body.private }}
          Owner: ${{ steps['get-repo-data'].output.body.owner.login }}
          Created: ${{ steps['get-repo-data'].output.body.created_at }}
          
          Full JSON Response:
          ${{ steps['get-repo-data'].output.body | dump(2) }}
