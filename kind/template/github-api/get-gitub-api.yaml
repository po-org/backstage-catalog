apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-api-example
  title: GitHub API Integration Example
  description: Template demonstrating GitHub API calls using http:backstage:request
  tags:
    - github
    - api
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: Repository Information
      required:
        - repoName
        - owner
      properties:
        repoName:
          title: Repository Name
          type: string
          description: Name of the GitHub repository
        owner:
          title: Repository Owner
          type: string
          description: GitHub username or organization
        description:
          title: Repository Description
          type: string
          description: Description for the repository
        isPrivate:
          title: Private Repository
          type: boolean
          default: false

  steps:
    - id: get-repo-data
      name: Get Repository Details
      action: http:backstage:request
      input:
        method: "GET"
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          content-type: "application/json"
          Accept: "application/vnd.github.v3+json"

    - id: log_github_debug
      name: Log GitHub Info
      action: debug:log
      input: 
        message: |
          job_data: "${{ steps.get-repo-data.output.body }}"
          status_code: "${{ steps.get-repo-data.output.code }}"
          pretty_json: "${{ steps.get-repo-data.output.body | dump }}"
