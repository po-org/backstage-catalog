apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mygroupspicker-example
  title: MyGroupsPicker Feature
  description: Select from groups you are a member of
spec:
  owner: user:default/guest
  type: service
  
  parameters:
    - title: Group Selection
      properties:
        myTeams:
          title: My Teams
          type: array
          description: Select from teams you belong to
          ui:field: MyGroupsPicker
          ui:options:
            allowedKinds:
              - Group
          ui:help: 'Only groups you are a member of will appear'
        
        primaryTeam:
          title: Primary Team
          type: string
          description: Select your primary team
          ui:field: MyGroupsPicker
          ui:help: 'Single selection from your groups'
  
  steps:
    - id: log
      name: Log Selection
      action: debug:log
      input:
        message: |
          Selected Teams: ${{ parameters.myTeams }}
          Primary Team: ${{ parameters.primaryTeam }}
