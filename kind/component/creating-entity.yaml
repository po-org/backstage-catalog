apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: register-existing-entity
  title: Register Existing Entity
  description: Register an existing catalog-info.yaml from a repository
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Entity Location
      required:
        - catalogUrl
      properties:
        catalogUrl:
          title: Catalog Info URL
          type: string
          description: Full URL to the catalog-info.yaml file
          ui:placeholder: 'https://github.com/org/repo/blob/main/catalog-info.yaml'

  steps:
    - id: register
      name: Register Entity
      action: catalog:register
      input:
        catalogInfoUrl: ${{ parameters.catalogUrl }}

  output:
    text:
      - title: Entity Registered
        content: 'Successfully registered entity from ${{ parameters.catalogUrl }}'
