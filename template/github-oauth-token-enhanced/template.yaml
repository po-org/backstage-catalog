apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-oauth-debug
  title: GitHub OAuth Debug Template
  description: Simple template to test GitHub OAuth token authentication
  tags:
    - debug
    - oauth
    - github
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: GitHub Authentication
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Select a GitHub Repository
          type: string
          description: This will trigger OAuth authentication
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - user

    - title: Repository to Query
      required:
        - owner
        - repoName
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub username or organization
          default: C-Nell
        
        repoName:
          title: Repository Name
          type: string
          description: Name of the repository to query
          default: my-new-repo

  steps:
    - id: log-authentication
      name: Log Authentication Status
      action: debug:log
      input:
        message: |
          ====================================
          🔐 AUTHENTICATION STATUS
          ====================================
          ✅ OAuth Token Acquired: Yes
          📏 Token Length: ${{ secrets.USER_OAUTH_TOKEN.length }} characters
          🔑 Token Preview: ${{ secrets.USER_OAUTH_TOKEN.substring(0, 15) }}...
          
          ====================================
          👤 USER INFORMATION
          ====================================
          User Name: ${{ user.entity.metadata.name }}
          User Email: ${{ user.entity.spec.profile.email }}
          Display Name: ${{ user.entity.spec.profile.displayName }}
          
          ====================================
          📦 REPOSITORY PARAMETERS
          ====================================
          Owner: ${{ parameters.owner }}
          Repo: ${{ parameters.repoName }}
          Full Path: ${{ parameters.owner }}/${{ parameters.repoName }}

    - id: get-authenticated-user
      name: Get Authenticated GitHub User
      action: http:backstage:request
      input:
        method: GET
        path: /api/github/user
        headers:
          Authorization: token ${{ secrets.USER_OAUTH_TOKEN }}
          Accept: application/vnd.github.v3+json

    - id: log-github-user
      name: Log GitHub User Info
      action: debug:log
      input:
        message: |
          ====================================
          🐙 GITHUB AUTHENTICATED USER
          ====================================
          Response Code: ${{ steps['get-authenticated-user'].output.code }}
          Login: ${{ steps['get-authenticated-user'].output.body.login }}
          Name: ${{ steps['get-authenticated-user'].output.body.name }}
          Email: ${{ steps['get-authenticated-user'].output.body.email }}
          Bio: ${{ steps['get-authenticated-user'].output.body.bio }}
          Public Repos: ${{ steps['get-authenticated-user'].output.body.public_repos }}
          Followers: ${{ steps['get-authenticated-user'].output.body.followers }}
          Created: ${{ steps['get-authenticated-user'].output.body.created_at }}

    - id: get-repo-data
      name: Get Repository Details
      action: http:backstage:request
      input:
        method: GET
        path: /api/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          Authorization: token ${{ secrets.USER_OAUTH_TOKEN }}
          Accept: application/vnd.github.v3+json

    - id: log-repo-info
      name: Log Repository Info
      action: debug:log
      input:
        message: |
          ====================================
          📦 REPOSITORY DETAILS
          ====================================
          Response Code: ${{ steps['get-repo-data'].output.code }}
          Name: ${{ steps['get-repo-data'].output.body.name }}
          Full Name: ${{ steps['get-repo-data'].output.body.full_name }}
          Description: ${{ steps['get-repo-data'].output.body.description }}
          Private: ${{ steps['get-repo-data'].output.body.private }}
          Owner: ${{ steps['get-repo-data'].output.body.owner.login }}
          Default Branch: ${{ steps['get-repo-data'].output.body.default_branch }}
          
          📊 STATISTICS
          Stars: ⭐ ${{ steps['get-repo-data'].output.body.stargazers_count }}
          Forks: 🍴 ${{ steps['get-repo-data'].output.body.forks_count }}
          Watchers: 👀 ${{ steps['get-repo-data'].output.body.watchers_count }}
          Open Issues: 🐛 ${{ steps['get-repo-data'].output.body.open_issues_count }}
          
          📅 DATES
          Created: ${{ steps['get-repo-data'].output.body.created_at }}
          Updated: ${{ steps['get-repo-data'].output.body.updated_at }}
          Pushed: ${{ steps['get-repo-data'].output.body.pushed_at }}
          
          🔐 YOUR PERMISSIONS
          Admin: ${{ steps['get-repo-data'].output.body.permissions.admin }}
          Push: ${{ steps['get-repo-data'].output.body.permissions.push }}
          Pull: ${{ steps['get-repo-data'].output.body.permissions.pull }}

    - id: log-full-response
      name: Log Full JSON Response
      action: debug:log
      input:
        message: |
          ====================================
          📄 FULL API RESPONSE (JSON)
          ====================================
          ${{ steps['get-repo-data'].output.body | dump(2) }}

  output:
    links:
      - title: View Repository on GitHub
        url: ${{ steps['get-repo-data'].output.body.html_url }}
        icon: github
      - title: Clone Repository
        url: ${{ steps['get-repo-data'].output.body.clone_url }}
    text:
      - title: Repository
        content: |
          **Full Name:** ${{ steps['get-repo-data'].output.body.full_name }}
          **Stars:** ${{ steps['get-repo-data'].output.body.stargazers_count }}
      - title: Authenticated User
        content: |
          **GitHub User:** ${{ steps['get-authenticated-user'].output.body.login }}
          **Name:** ${{ steps['get-authenticated-user'].output.body.name }}