apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-oauth-debug-simple
  title: GitHub OAuth Debug (Simple)
  description: Test if OAuth token is being captured
  tags:
    - debug
    - oauth
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: GitHub Authentication
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Select a GitHub Repository
          type: string
          description: This will trigger OAuth authentication
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - user
                  - read:org

  steps:
    - id: log-token-check
      name: Check if Token Exists
      action: debug:log
      input:
        message: |
          ====================================
          🔐 OAUTH TOKEN STATUS
          ====================================
          Token variable exists: ${{ secrets.USER_OAUTH_TOKEN !== undefined }}
          Token is not null: ${{ secrets.USER_OAUTH_TOKEN !== null }}
          Token is not empty: ${{ secrets.USER_OAUTH_TOKEN !== '' }}

    - id: log-token-details
      name: Log Token Details
      action: debug:log
      input:
        message: |
          ====================================
          📋 TOKEN INFORMATION
          ====================================
          Token Length: ${{ secrets.USER_OAUTH_TOKEN.length }}
          Token First 10 chars: ${{ secrets.USER_OAUTH_TOKEN.substring(0, 10) }}
          Token First 20 chars: ${{ secrets.USER_OAUTH_TOKEN.substring(0, 20) }}
          Token Type (starts with): ${{ secrets.USER_OAUTH_TOKEN.substring(0, 4) }}

    - id: log-user-info
      name: Log Backstage User Info
      action: debug:log
      input:
        message: |
          ====================================
          👤 BACKSTAGE USER INFORMATION
          ====================================
          User Entity Name: ${{ user.entity.metadata.name }}
          User Email: ${{ user.entity.spec.profile.email }}
          User Display Name: ${{ user.entity.spec.profile.displayName }}
          User Entity UID: ${{ user.entity.metadata.uid }}

    - id: log-repo-url
      name: Log Selected Repository
      action: debug:log
      input:
        message: |
          ====================================
          📦 SELECTED REPOSITORY
          ====================================
          Full Repo URL: ${{ parameters.repoUrl }}
          Parsed Owner: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}
          Parsed Repo: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          Parsed Host: ${{ parameters.repoUrl | parseRepoUrl | pick('host') }}

    - id: log-success
      name: OAuth Success Message
      action: debug:log
      input:
        message: |
          ====================================
          ✅ SUCCESS!
          ====================================
          OAuth token was successfully captured!
          You can now use this token in GitHub API calls.
          
          Token is available as: secrets.USER_OAUTH_TOKEN
          Token will be cached for this session.

  output:
    text:
      - title: OAuth Status
        content: |
          ✅ **OAuth token successfully captured!**
          
          Token length: ${{ secrets.USER_OAUTH_TOKEN.length }} characters
          
          User: ${{ user.entity.metadata.name }}
      - title: Next Steps
        content: |
          The OAuth token is now available and can be used to make authenticated GitHub API calls.
          
          Token will remain cached for this browser session.