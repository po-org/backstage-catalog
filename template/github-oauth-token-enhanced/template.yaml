apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: oauth-diagnostic
  title: OAuth Diagnostic Template
  description: Diagnose OAuth token capture issues
  tags:
    - debug
    - oauth
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: GitHub Authentication
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Select a GitHub Repository
          type: string
          description: This will trigger OAuth authentication
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - user

  steps:
    - id: check-secrets
      name: Check All Secrets
      action: debug:log
      input:
        message: |
          Checking secrets object...
          Secrets: ${{ secrets }}
          
    - id: check-user-oauth
      name: Check USER_OAUTH_TOKEN
      action: debug:log
      input:
        message: |
          USER_OAUTH_TOKEN type: ${{ typeof secrets.USER_OAUTH_TOKEN }}
          USER_OAUTH_TOKEN value: ${{ secrets.USER_OAUTH_TOKEN }}
          
    - id: check-context
      name: Check Full Context
      action: debug:log
      input:
        message: |
          Parameters: ${{ parameters | dump }}
          User: ${{ user | dump }}
          Secrets: ${{ secrets | dump }}

  output:
    text:
      - title: Diagnostic Complete
        content: Check the task logs for detailed information