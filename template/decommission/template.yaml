apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: decommission-request-form
  title: Decommission Servers (AAP Workflow)
  description: >
    Self-service request to decommission servers.
    Launches an Ansible AAP workflow and records the request
    in Backstage for audit and traceability.
  tags:
    - decommission
    - aap
    - workflow

spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: Decommission Configuration
      description: |
        Steps:
        1) Add server FQDNs
        2) (Optional) Provide extra_vars
        3) Confirm authorization and submit
      required:
        - servers
        - confirm_decommission
      properties:
        servers:
          title: Servers to decommission
          description: One fully-qualified hostname per entry
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            title: Server FQDN
          ui:
            widget: tags
            options:
              placeholder: "hostname.ds.irsnet.gov"

        extra_vars:
          title: Optional extra_vars (advanced)
          description: >
            Optional JSON object passed to the AAP workflow.
            Example: {"drain": true, "skip_checks": false}
          type: object
          default: {}
          ui:
            widget: json
            options:
              collapsed: true

        confirm_decommission:
          title: I confirm these server(s) should be decommissioned and I am authorized
          description: >
            This action is destructive. Only check this box if you are authorized.
          type: boolean
          # default: false

  steps:
    # ------------------------------------------------------------
    # AUDIT / TRACEABILITY LOG (ALWAYS RUNS)
    # ------------------------------------------------------------
    - id: review_parameters
      name: Review request details
      action: debug:log
      input:
        message: |
          ${{ {
            summary: "Decommission request submitted",
            requestor_email: user.entity.spec.profile.email,
            requestor_id: user.entity.metadata.name,
            timestamp: now(),
            servers: parameters.servers,
            extra_vars: parameters.extra_vars,
            confirmed: parameters.confirm_decommission
          } | dump }}

    # ------------------------------------------------------------
    # AAP WORKFLOW — HARD GATED BY CONFIRMATION
    # ------------------------------------------------------------
    - id: call-decomm-workflow
      name: Call Ansible AAP workflow (decommission)
      if: ${{ parameters.confirm_decommission == true }}
      action: http:backstage:request
      input:
        method: POST
        path: /proxy/aap-prod/api/v2/workflow_templates/12345/launch/
        headers:
          content-type: application/json
        body: |
          ${{ {
            extra_vars: {
              servers: parameters.servers,
              request_email: user.entity.spec.profile.email,
              request_seid: user.entity.metadata.name
            },
            user_extra_vars: parameters.extra_vars
          } | dump }}
        logRequestPath: true
        continueOnBadResponse: false
