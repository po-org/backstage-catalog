apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: decommission-request-form
  title: Decommission Servers (AAP Workflow)
  description: >
    Self-service request to decommission servers.
    Requires explicit typed confirmation.
  tags:
    - decommission
    - aap
    - workflow

spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: Decommission Configuration
      required:
        - servers
        - confirm_decommission
        - confirm_phrase
      properties:
        servers:
          title: Servers to decommission
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          ui:
            widget: tags
            options:
              placeholder: "hostname.ds.irsnet.gov"

        # extra_vars:
        #   title: Optional extra_vars (advanced)
        #   type: object
        #   default: {}
        #   ui:
        #     widget: json
        #     options:
        #       collapsed: true

        confirm_decommission:
          title: I confirm I am authorized to decommission these servers
          type: boolean
          # default: false

        confirm_phrase:
          title: Type DECOMMISSION to confirm
          description: >
            This action is destructive.
            You must type DECOMMISSION (all caps) to proceed.
          type: string
          ui:
            placeholder: "DECOMMISSION"

  steps:
    # ------------------------------------------------------------
    # AUDIT LOG
    # ------------------------------------------------------------
    - id: review_parameters
      name: Review request
      action: debug:log
      input:
        message: |
          ${{ {
            summary: "Decommission request submitted",
            requestor_email: user.entity.spec.profile.email,
            requestor_id: user.entity.metadata.name,
            timestamp: now(),
            servers: parameters.servers,
            confirmed_checkbox: parameters.confirm_decommission,
            confirm_phrase: parameters.confirm_phrase
          } | dump }}

    # ------------------------------------------------------------
    # MESSAGE WHEN SKIPPED (INVERSE CONDITION)
    # ------------------------------------------------------------
    - id: decomm-skipped
      name: Decommission skipped
      if: ${{ parameters.confirm_phrase != "DECOMMISSION" }}
      action: debug:log
      input:
        message: >
          Decommission workflow was NOT launched.
          Reason: confirmation phrase was not provided or did not match "DECOMMISSION" phrase.
    
    # ------------------------------------------------------------
    # AAP WORKFLOW — STRONGLY GATED
    # ------------------------------------------------------------
    - id: call-decomm-workflow
      name: Call Ansible AAP workflow (decommission)
      if: ${{ parameters.confirm_phrase == "DECOMMISSION" }}
      action: http:backstage:request
      input:
        method: POST
        path: /proxy/aap-prod/api/v2/workflow_templates/12345/launch/
        headers:
          content-type: application/json
        body: |
          ${{ {
            extra_vars: {
              servers: parameters.servers,
              request_email: user.entity.spec.profile.email,
              request_seid: user.entity.metadata.name
            },
            user_extra_vars: parameters.extra_vars
          } | dump }}
