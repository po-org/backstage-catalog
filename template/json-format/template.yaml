apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-pretty-json-output
  namespace: default
  title: GitHub Repo - Pretty JSON Output
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: Repository
      required:
        - owner
        - repo
      properties:
        owner:
          title: Owner
          type: string
          default: po-org
        repo:
          title: Repository
          type: string
          default: backstage-catalog
  steps:
    - id: get-repo
      name: Get Repository
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
    
    - id: log-summary
      name: Log Repository Summary
      action: debug:log
      input:
        message: |
          Repository Summary JSON:
          {
            "name": "${{ steps['get-repo'].output.body.name }}",
            "full_name": "${{ steps['get-repo'].output.body.full_name }}",
            "owner": "${{ steps['get-repo'].output.body.owner.login }}",
            "stars": ${{ steps['get-repo'].output.body.stargazers_count }},
            "forks": ${{ steps['get-repo'].output.body.forks_count }},
            "url": "${{ steps['get-repo'].output.body.html_url }}"
          }
  
  output:
    links:
      - title: View Repository
        url: ${{ steps['get-repo'].output.body.html_url }}
    
    text:
      - title: Repository Name
        content: ${{ steps['get-repo'].output.body.full_name }}
      
      - title: Stars
        content: ⭐ ${{ steps['get-repo'].output.body.stargazers_count }}
      
      - title: Repository Summary (Table)
        content: |
          | Property | Value |
          |----------|-------|
          | Name | ${{ steps['get-repo'].output.body.name }} |
          | Full Name | ${{ steps['get-repo'].output.body.full_name }} |
          | Owner | ${{ steps['get-repo'].output.body.owner.login }} |
          | Stars | ⭐ ${{ steps['get-repo'].output.body.stargazers_count }} |
          | Forks | 🍴 ${{ steps['get-repo'].output.body.forks_count }} |
          | URL | ${{ steps['get-repo'].output.body.html_url }} |
      
      - title: Repository Summary (Full JSON)
        content: |
```json
          ${{ steps['get-repo'].output.body | dump(2) }}
```
