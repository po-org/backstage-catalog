apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: validation-patterns-features
  title: ✅ Validation & Custom Patterns
  description: Advanced validation rules and patterns
  tags:
    - showcase
    - validation
    - patterns
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Validation & Custom Patterns
      description: Advanced validation rules and patterns
      properties:
        resourceName:
          title: Resource Name
          type: string
          description: Must be lowercase alphanumeric with hyphens
          pattern: '^[a-z0-9-]+$'
          minLength: 3
          maxLength: 63
          ui:help: 'Example: my-resource-name'
        
        version:
          title: Version Number
          type: string
          description: Semantic version (e.g., 1.0.0)
          pattern: '^\d+\.\d+\.\d+$'
          default: "1.0.0"
          ui:help: 'Must follow semantic versioning: major.minor.patch'
        
        githubUsername:
          title: GitHub Username
          type: string
          description: Valid GitHub username
          pattern: '^[a-zA-Z0-9](?:[a-zA-Z0-9]|-(?=[a-zA-Z0-9])){0,38}$'
          ui:help: 'Must be a valid GitHub username format'
        
        portNumber:
          title: Port Number
          type: integer
          description: Valid port number
          minimum: 1024
          maximum: 65535
          default: 8080
          ui:help: 'Must be between 1024 and 65535'
        
        kubernetesLabel:
          title: Kubernetes Label
          type: string
          description: Valid k8s label (key=value)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:help: 'Must follow Kubernetes label naming rules'

  steps:
    - id: log-validation-patterns
      name: Log Validation Pattern Values
      action: debug:log
      input:
        message: |
          ✅ VALIDATION PATTERNS RESULTS:
          
          Resource Name: ${{ parameters.resourceName }}
          Version: ${{ parameters.version }}
          GitHub Username: ${{ parameters.githubUsername }}
          Port Number: ${{ parameters.portNumber }}
          Kubernetes Label: ${{ parameters.kubernetesLabel }}
          
          Full JSON:
          ${{ parameters | dump(2) }}
  
  output:
    text:
      - title: Results
        content: Successfully validated all pattern inputs