apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-advanced-github-repo
  title: HTTP Advanced – GitHub Repository Fetch
  description: Fetch a GitHub repository using the advanced HTTP action via the proxy
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: GitHub Repository
      required:
        - repoName
        - owner
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub organization or user
        repoName:
          title: Repository Name
          type: string
          description: Repository name

  steps:
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:advanced:request
      input:
        method: GET
        # Use the proxy path instead of absolute URL
        url: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          Accept: application/vnd.github.v3+json
        retry:
          enabled: true
          maxRetries: 3
        verbose: true

    - id: showJson
      name: Show JSON Output
      action: debug:log
      input:
        message: ${{ steps.fetchRepo.output.prettyJson }}
