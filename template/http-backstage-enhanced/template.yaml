apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: api-call-enhanced
  namespace: default
  title: API Call Enhanced
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: Repository
      required: [owner, repo]
      properties:
        owner:
          title: Owner
          type: string
          default: po-org
        repo:
          title: Repository
          type: string
          default: backstage-catalog

  steps:

    - id: fetch-repo
      name: Fetch Repository with Enhanced HTTP
      action: http:backstage:request:advanced
      input:
        url: https://api.github.com/repos/${{ parameters.owner }}/${{ parameters.repo }}
        method: GET
        auth:
          type: bearer
          token: ${{ secrets.GITHUB_TOKEN }}  # Optional if public repo
        retry:
          enabled: true
          maxRetries: 3
        verbose: true

  output:
    links:
      - title: View Response File
        url: ${{ steps.fetch-repo.output.filePath }}
