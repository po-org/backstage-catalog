apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-advanced-github-repo
  title: HTTP Advanced – GitHub Repository Fetch
  description: Fetch a GitHub repository using the advanced HTTP action via the proxy
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: GitHub Repository
      required:
        - owner
        - repoName
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub username or org (e.g., backstage)
        repoName:
          title: Repository
          type: string
          description: Repository name (e.g., backstage)

  steps:
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:advanced:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          content-type: "application/json"
          Accept: "application/vnd.github.v3+json"
        retry:
          enabled: true
          maxRetries: 3
