apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-advanced-github-repo
  title: HTTP Advanced – GitHub Repository Fetch
  description: Fetch a GitHub repository using the advanced HTTP action and output structured JSON
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: GitHub Repository
      required:
        - repo
      properties:
        repo:
          title: Repository
          type: string
          description: org/repo (e.g. backstage/backstage)

  steps:
    # -------------------------------------------------------
    # 1. Fetch GitHub repository using advanced HTTP action
    # -------------------------------------------------------
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:advanced:request
      input:
        method: GET
        url: https://api.github.com/repos/${{ parameters.repo }}
        auth:
          type: bearer
          token: ${{ secrets.GITHUB_TOKEN }}
        retry:
          enabled: true
          maxRetries: 3
        # Optional polling annotation, uncomment if needed
        # polling:
        #   enabled: true
        #   intervalMs: 5000
        #   timeoutMs: 60000
