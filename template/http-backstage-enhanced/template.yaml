apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-pretty-json-output
  title: HTTP pretty json output
  description: Fetch a GitHub repository and outputs with pretty json plugin.
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: GitHub Repository
      required:
        - repoName
        - owner
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub organization or user
          ui:autofocus: true
          default: backstage
        repoName:
          title: Repository Name
          type: string
          description: Repository name
          default: backstage

  steps:
    - id: fetchRepo
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
    
    # Pass data using template syntax (not step reference)
    - id: showPrettyJson
      action: http-pretty-output:log
      input:
        data: ${{ steps.fetchRepo.output.body }}  # ✅ Template resolves this
        maskKeys: [token, secret]
    
