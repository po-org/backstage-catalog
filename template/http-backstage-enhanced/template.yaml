apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-pretty-json-output
  title: HTTP pretty json output
  description: Fetch a GitHub repository and outputs with pretty json plugin.
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: GitHub Repository
      required:
        - repoName
        - owner
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub organization or user
          ui:autofocus: true
          default: backstage
        repoName:
          title: Repository Name
          type: string
          description: Repository name
          default: backstage
  steps:
    # Step 1: Fetch GitHub repository data
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:backstage:request
      input:
        method: GET
        # Note: Use 'path' instead of 'url' for proxy requests
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          Accept: application/vnd.github.v3+json
    
    # Step 2: Display the response using http-pretty-output
    - id: showPrettyJson
      name: Display Pretty JSON Output
      action: http-pretty-output:log
      input:
        stepName: fetchRepo      # Reference the step above
        outputKey: body          # http:backstage:request stores response in 'body'
        maskKeys: []             # Add any sensitive keys to mask here

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps.fetchRepo.output.body.html_url }}
    text:
      - title: Repository Information
        content: |
          **Repository:** ${{ steps.fetchRepo.output.body.full_name }}
          **Description:** ${{ steps.fetchRepo.output.body.description }}
          **Stars:** ${{ steps.fetchRepo.output.body.stargazers_count }}
          **Forks:** ${{ steps.fetchRepo.output.body.forks_count }}
          **Language:** ${{ steps.fetchRepo.output.body.language }}
