apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-pretty-json-output
  title: HTTP pretty json output
  description: Fetch a GitHub repository and outputs with pretty json plugin.
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: GitHub Repository
      required:
        - repoName
        - owner
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub organization or user
          ui:autofocus: true
          default: backstage
        repoName:
          title: Repository Name
          type: string
          description: Repository name
          default: backstage
  steps:
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}
        headers:
          Accept: application/vnd.github.v3+json
    
    - id: fetchCommits
      name: Fetch GitHub Commits
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repoName }}/commits
        headers:
          Accept: application/vnd.github.v3+json
    
    # Log to console with pretty formatting
    - id: showPrettyJson
      action: http-pretty-output:log
      input:
        data: ${{ steps.fetchRepo.output.body }}
        maskKeys: [token, secret]
    
    - id: showPrettyJsonCommits
      action: http-pretty-output:log
      input:
        data: ${{ steps.fetchCommits.output.body }}
        maskKeys: [token, secret]
    
    # Format JSON for output display
    - id: formatRepoJson
      name: Format Repository JSON
      action: debug:log
      input:
        message: ${{ steps.fetchRepo.output.body | dump(2) }}
    
    - id: formatCommitsJson
      name: Format Commits JSON
      action: debug:log
      input:
        message: ${{ steps.fetchCommits.output.body | dump(2) }}
  
  # ========================================
  # OUTPUT
  # ========================================
  output:
    links:
      - title: 🔗 View Repository on GitHub
        url: https://github.com/${{ parameters.owner }}/${{ parameters.repoName }}
      - title: 📊 Repository Commits
        url: https://github.com/${{ parameters.owner }}/${{ parameters.repoName }}/commits
    text:
      - title: Template Completed
        content: |
          Successfully fetched GitHub repository data!
          
          Features demonstrated:
          ✅ HTTP proxy requests via http:backstage:request
          ✅ Pretty JSON output formatting
          ✅ Multiple API endpoint fetching
          ✅ Sensitive data masking
          
          📋 Repository and commit data have been formatted and displayed in the task logs above.
      - title: Repository
        content: ${{ parameters.owner }}/${{ parameters.repoName }}
