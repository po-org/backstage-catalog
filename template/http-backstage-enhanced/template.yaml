apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-advanced-pretty-json
  title: HTTP Advanced – Pretty JSON Output
  description: Call an API using the advanced HTTP action and render pretty JSON
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: GitHub Repository
      required:
        - repo
      properties:
        repo:
          title: Repository
          type: string
          description: org/repo (e.g. backstage/backstage)

  steps:
    # -------------------------------------------------------
    # 1. Call your advanced HTTP action
    # -------------------------------------------------------
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:advanced:request
      input:
        method: GET
        url: https://api.github.com/repos/${{ parameters.repo }}
        responseType: json
        auth:
          type: bearer
          token: ${{ secrets.GITHUB_TOKEN }}
        retry:
          enabled: true
          maxRetries: 3
        verbose: true


