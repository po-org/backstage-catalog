apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: api-call-enhanced
  namespace: default
  title: API Call Enhanced
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: Repository
      required: [owner, repo]
      properties:
        owner:
          title: Owner
          type: string
          default: po-org
        repo:
          title: Repository
          type: string
          default: backstage-catalog

  steps:
    - id: fetch-repo
      name: Fetch Repository with Enhanced HTTP
      action: http:backstage:request:advanced
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
        logTitle: Repository Data
        logMessage: Full response from GitHub API
        indent: 4

  output:
    links:
      - title: View Response File
        url: ${{ steps.fetch-repo.output.filePath }}
