apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-advanced-github-repo
  title: HTTP Advanced – GitHub Repository Fetch
  description: Fetch a GitHub repository using the advanced HTTP action and output structured JSON
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: GitHub Repository
      required:
        - owner
        - repo
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub username or organization (e.g., backstage)
        repo:
          title: Repository Name
          type: string
          description: Repository name (e.g., backstage)

  steps:
    # -------------------------------------------------------
    # 1. Fetch GitHub repository using advanced HTTP action
    # -------------------------------------------------------
    # - id: fetchRepo
    #   name: Fetch GitHub Repository
    #   action: http:advanced:request
    #   input:
    #     method: GET
    #     url: https://api.github.com/repos/${{ parameters.owner }}/${{ parameters.repo }}
    #     auth:
    #       type: bearer
    #       token: ${{ secrets.GITHUB_TOKEN }}
    #     retry:
    #       enabled: true
    #       maxRetries: 3

    - id: get-repo
      name: Fetch GitHub Repo
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
        headers:
          Accept: "application/vnd.github.v3+json"


    # -------------------------------------------------------
    # 2. Show JSON output automatically
    # -------------------------------------------------------
    - id: showJson
      name: Show JSON Output
      action: debug:log
      input:
        message: ${{ steps.fetchRepo.output.prettyJson }}

    - id: debug-token
      name: Debug GitHub Token
      action: debug:log
      input:
        message: "GITHUB_TOKEN present: ${{ secrets.GITHUB_TOKEN ? 'yes' : 'no' }}"

