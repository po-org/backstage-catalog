apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: http-advanced-github-repo
  title: HTTP Advanced – GitHub Repository Fetch
  description: Fetch a GitHub repository using the advanced HTTP action and get structured pretty JSON output
spec:
  owner: user:default/c-nell
  type: service

  parameters:
    - title: GitHub Repository
      required:
        - owner
        - repo
      properties:
        owner:
          title: Repository Owner
          type: string
          description: GitHub org or user (e.g. backstage)
        repo:
          title: Repository Name
          type: string
          description: Repository name (e.g. backstage)

  steps:
    - id: fetchRepo
      name: Fetch GitHub Repository
      action: http:advanced:request
      input:
        method: GET
        url: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
        headers:
          Accept: "application/vnd.github.v3+json"
        # Optional polling for long-running APIs
        # polling:
        #   enabled: true
        #   intervalMs: 5000
        #   timeoutMs: 60000
        retry:
          enabled: true
          maxRetries: 3
        verbose: true

    - id: showJson
      name: Show JSON Output
      action: debug:log
      input:
        message: ${{ steps.fetchRepo.output.prettyJson }}
