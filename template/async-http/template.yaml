apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dynamic-api-call
  title: Dynamic API Call
  description: Make API calls to any endpoint through the dynamic-api proxy
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: API Request
      required:
        - endpoint
      properties:
        endpoint:
          title: API Endpoint
          type: string
          description: 'Endpoint path (e.g., /users, /orders/123, /status)'
          default: '/users'
          
        httpMethod:
          title: HTTP Method
          type: string
          enum: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
          default: GET
          
        requestBody:
          title: Request Body (JSON)
          type: string
          description: JSON body for POST/PUT/PATCH requests
          ui:widget: textarea
          ui:options:
            rows: 5
  
  steps:
    - id: make-api-call
      name: Execute API Call
      action: http:backstage:request
      input:
        method: ${{ parameters.httpMethod }}
        path: /proxy/dynamic-api${{ parameters.endpoint }}
        headers:
          content-type: "application/json"
        body: ${{ parameters.requestBody }}
    
    - id: log-response
      name: Log Response
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          🎯 API CALL COMPLETED
          ═══════════════════════════════════════════════════════
          
          📍 Request:
             • Target: https://api.example.com
             • Endpoint: ${{ parameters.endpoint }}
             • Full Path: /proxy/dynamic-api${{ parameters.endpoint }}
             • Method: ${{ parameters.httpMethod }}
             • Status: ${{ steps['make-api-call'].output.code }}
          
          📊 Response:
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
          📥 Headers:
          ${{ steps['make-api-call'].output.headers | dump(2) }}
          
          ═══════════════════════════════════════════════════════
    
    - id: create-component
      name: Register Component
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: api-call-${{ parameters.endpoint | replace("/", "-") | replace("_", "-") | lower }}
            description: ${{ parameters.httpMethod }} request to ${{ parameters.endpoint }}
            annotations:
              backstage.io/managed-by-location: 'url:generated'
              api.backstage.io/endpoint: ${{ parameters.endpoint }}
              api.backstage.io/method: ${{ parameters.httpMethod }}
              api.backstage.io/status: '${{ steps["make-api-call"].output.code }}'
              api.backstage.io/timestamp: ${{ "" | now }}
            tags:
              - api-call
              - dynamic-api
          spec:
            type: service
            lifecycle: experimental
            owner: user:default/c-nell
  
  output:
    links:
      - title: 📋 View Component
        url: ${{ steps['create-component'].output.entityRef }}
    
    text:
      - title: ✅ API Call Summary
        content: |
          Endpoint: ${{ parameters.httpMethod }} ${{ parameters.endpoint }}
          Status: ${{ steps['make-api-call'].output.code }}
          Target: https://api.example.com${{ parameters.endpoint }}
          
      - title: 📦 Response Body
        content: |
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
      - title: 📥 Response Headers
        content: |
          ${{ steps['make-api-call'].output.headers | dump(2) }}
