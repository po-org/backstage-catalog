apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: api-call-from-config
  title: API Call from App Config
  description: Make API calls using endpoints defined in app-config.yaml
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: Job Configuration
      required:
        - jobName
        - apiEndpoint
      properties:
        jobName:
          title: Job Name
          type: string
          description: Name for this API call job
          
        apiEndpoint:
          title: API Endpoint
          type: string
          description: Which configured endpoint to call
          enum:
            - httpbin-delay
            - httpbin-get
            - httpbin-post
            - httpbin-uuid
            - custom-api-1
            - custom-api-2
          enumNames:
            - 'Httpbin Delay (5s)'
            - 'Httpbin GET'
            - 'Httpbin POST'
            - 'Httpbin UUID'
            - 'Custom API 1'
            - 'Custom API 2'
          
        httpMethod:
          title: HTTP Method
          type: string
          enum: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
          default: GET
          
        requestBody:
          title: Request Body (optional)
          type: string
          ui:widget: textarea
          ui:options:
            rows: 3
            
    - title: Options
      properties:
        createComponent:
          title: Create Catalog Component
          type: boolean
          default: true
  
  steps:
    - id: fetch-config
      name: Read API Config
      action: debug:log
      input:
        message: |
          Reading configuration for endpoint: ${{ parameters.apiEndpoint }}
          Base URL from config: ${{ apiEndpoints[${{ parameters.apiEndpoint }}].url }}
    
    - id: make-api-call
      name: Execute API Call
      action: http:backstage:request
      input:
        method: ${{ parameters.httpMethod }}
        path: ${{ parameters.apiEndpoint }}
        headers:
          content-type: "application/json"
        body: ${{ parameters.requestBody }}
    
    - id: log-response
      name: Log API Response
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          🎯 API CALL COMPLETED
          ═══════════════════════════════════════════════════════
          
          📍 Request:
             Endpoint: ${{ parameters.apiEndpoint }}
             Method: ${{ parameters.httpMethod }}
             Status: ${{ steps['make-api-call'].output.code }}
          
          📊 Response Body:
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
          📥 Response Headers:
          ${{ steps['make-api-call'].output.headers | dump(2) }}
          
          ═══════════════════════════════════════════════════════
    
    - id: create-catalog-component
      name: Register Component
      if: ${{ parameters.createComponent }}
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: api-job-${{ parameters.jobName | replace(" ", "-") | lower }}
            description: API call to ${{ parameters.apiEndpoint }}
            annotations:
              backstage.io/managed-by-location: 'url:generated'
              api.backstage.io/endpoint: ${{ parameters.apiEndpoint }}
              api.backstage.io/method: ${{ parameters.httpMethod }}
              api.backstage.io/status-code: '${{ steps["make-api-call"].output.code }}'
              api.backstage.io/executed-at: ${{ "" | now }}
            tags:
              - api-call
              - automated
              - ${{ parameters.apiEndpoint }}
          spec:
            type: service
            lifecycle: experimental
            owner: user:default/c-nell
  
  output:
    links:
      - title: 📋 View Component
        url: ${{ steps['create-catalog-component'].output.entityRef }}
    
    text:
      - title: ✅ API Call Summary
        content: |
          Job: ${{ parameters.jobName }}
          Endpoint: ${{ parameters.apiEndpoint }}
          Method: ${{ parameters.httpMethod }}
          Status: ${{ steps['make-api-call'].output.code }}
          
      - title: 📦 Response Body
        content: |
          ${{ steps['make-api-call'].output.body | dump(2) }}
