apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-job-tracking-httpbin
  title: Test Job Tracking (httpbin)
  description: Test async job tracking with httpbin delay endpoint
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: Test Configuration
      required:
        - testName
      properties:
        testName:
          title: Test Job Name
          type: string
          default: my-test-job
        
        delaySeconds:
          title: Job Duration (seconds)
          type: number
          default: 10
          enum: [5, 10, 20, 30]
  
  steps:
    - id: launch-test-job
      name: Launch Test Job
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/httpbin/delay/${{ parameters.delaySeconds }}
        headers:
          content-type: "application/json"
    
    - id: log-job-response
      name: Log Full Response
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          🎯 JOB COMPLETED SUCCESSFULLY
          ═══════════════════════════════════════════════════════
          
          📊 HTTP Status: ${{ steps['launch-test-job'].output.code }}
          
          📍 Request Details:
             • URL: ${{ steps['launch-test-job'].output.body.url }}
             • Origin IP: ${{ steps['launch-test-job'].output.body.origin }}
             • Delay: ${{ parameters.delaySeconds }} seconds
          
          📥 Request Headers Sent:
             • Host: ${{ steps['launch-test-job'].output.body.headers.Host }}
             • User-Agent: ${{ steps['launch-test-job'].output.body.headers['User-Agent'] }}
             • Content-Type: ${{ steps['launch-test-job'].output.body.headers['Content-Type'] }}
          
          📦 Full Response Body:
          ${{ steps['launch-test-job'].output.body | dump(2) }}
          
          ═══════════════════════════════════════════════════════
    
    - id: create-catalog-info
      name: Create Catalog Info
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: test-job-${{ parameters.testName | replace(" ", "-") | lower }}
            description: Test job tracking component - Completed after ${{ parameters.delaySeconds }}s delay
            annotations:
              backstage.io/managed-by-location: 'url:http://example.com/catalog-info.yaml'
              poll.backstage.io/enabled: 'true'
              poll.backstage.io/url: https://httpbin.org/uuid
              poll.backstage.io/status-path: 'uuid'
              poll.backstage.io/status: 'success'
              poll.backstage.io/completed-at: ${{ "" | now }}
              httpbin.io/origin-ip: ${{ steps['launch-test-job'].output.body.origin }}
              httpbin.io/request-url: ${{ steps['launch-test-job'].output.body.url }}
            tags:
              - test
              - job-tracking
              - httpbin
          spec:
            type: service
            lifecycle: experimental
            owner: user:default/c-nell
  
  output:
    links:
      - title: 📋 View Component in Catalog
        url: ${{ steps['create-catalog-info'].output.entityRef }}
      - title: 🔗 Test httpbin endpoint again
        url: https://httpbin.org/delay/${{ parameters.delaySeconds }}
    
    text:
      - title: ✅ Job Summary
        content: |
          Test job "${{ parameters.testName }}" completed successfully!
          
          ⏱️  Duration: ${{ parameters.delaySeconds }} seconds
          🌐 Origin IP: ${{ steps['launch-test-job'].output.body.origin }}
          📡 HTTP Status: ${{ steps['launch-test-job'].output.code }}
          
      - title: 📊 API Response Details
        content: |
          **Request URL:** 
          ${{ steps['launch-test-job'].output.body.url }}
          
          **Response Headers Received:**
          • Host: ${{ steps['launch-test-job'].output.body.headers.Host }}
          • User-Agent: ${{ steps['launch-test-job'].output.body.headers['User-Agent'] }}
          • Content-Type: ${{ steps['launch-test-job'].output.body.headers['Content-Type'] }}
          
          **Origin IP:** ${{ steps['launch-test-job'].output.body.origin }}
          
      - title: 🔍 Full JSON Response
        content: |
```json
          ${{ steps['launch-test-job'].output.body | dump(2) }}
```
```
