apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-simple
  title: GitHub Repo - Simple Output
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Repository
      required:
        - owner
        - repo
      properties:
        owner:
          title: Owner
          type: string
          default: po-org
        repo:
          title: Repository
          type: string
          default: backstage-catalog
  
  steps:
    - id: get-repo
      name: Get Repository
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
    
    - id: log-output
      name: Log Pretty JSON
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          📦 REPOSITORY DATA (Pretty Formatted)
          ═══════════════════════════════════════════════════════
          
          ${{ steps['get-repo'].output.body | dump(4) }}
          
          ═══════════════════════════════════════════════════════
  
  output:
    text:
      - title: Repository Data
        content: |
          ${{ steps['get-repo'].output.body | dump(4) }}
