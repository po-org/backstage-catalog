apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: api-dump
  title: API Call - Full Dump
spec:
  owner: user:default/c-nell
  type: service
  
  steps:
    - id: call-api
      name: Call API
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/backstage/backstage
    
    - id: dump
      name: Dump Everything
      action: debug:log
      input:
        message: |
          ${{ steps['call-api'].output | dump(2) }}
  
  output:
    text:
      - title: Raw Output
        content: |
          ${{ steps['call-api'].output | dump(2) }}
