apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-multi-endpoint
  title: GitHub Repo - Multiple Endpoints
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Repository
      required:
        - owner
        - repo
      properties:
        owner:
          title: Owner
          type: string
          default: po-org
        repo:
          title: Repository
          type: string
          default: backstage-catalog
  
  steps:
    # Repository Details
    - id: get-repo
      name: Get Repository Details
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
    
    # Branches
    - id: get-branches
      name: Get Branches
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/branches
    
    # Languages
    - id: get-languages
      name: Get Languages
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/languages
    
    # Contributors
    - id: get-contributors
      name: Get Contributors
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/contributors
    
    # Recent Commits
    - id: get-commits
      name: Get Recent Commits
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/commits?per_page=10
    
    # Tags
    - id: get-tags
      name: Get Tags
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/tags
    
    # Releases
    - id: get-releases
      name: Get Releases
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/releases
    
    # Pull Requests
    - id: get-pulls
      name: Get Pull Requests
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/pulls?state=all&per_page=10
    
    # Issues
    - id: get-issues
      name: Get Issues
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/issues?state=all&per_page=10
    
    # Topics
    - id: get-topics
      name: Get Topics
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/topics
        headers:
          Accept: application/vnd.github.mercy-preview+json
    
    # README
    - id: get-readme
      name: Get README
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/readme
    
    # Debug Log - Box Format
    - id: format-output
      name: Format Repository Data
      action: debug:log
      input:
        message: |
          ╔════════════════════════════════════════════════════════════════╗
          ║                    REPOSITORY INFORMATION                      ║
          ╠════════════════════════════════════════════════════════════════╣
          ║ Name:        ${{ steps['get-repo'].output.body.full_name }}
          ║ Visibility:  ${{ steps['get-repo'].output.body.visibility }}
          ║ Branch:      ${{ steps['get-repo'].output.body.default_branch }}
          ║ Language:    ${{ steps['get-repo'].output.body.language || 'N/A' }}
          ╠════════════════════════════════════════════════════════════════╣
          ║ STATISTICS                                                     ║
          ╠════════════════════════════════════════════════════════════════╣
          ║ ⭐ Stars:       ${{ steps['get-repo'].output.body.stargazers_count }}
          ║ 🍴 Forks:       ${{ steps['get-repo'].output.body.forks_count }}
          ║ 🐛 Issues:      ${{ steps['get-repo'].output.body.open_issues_count }}
          ║ 👁️  Watchers:    ${{ steps['get-repo'].output.body.watchers_count }}
          ╠════════════════════════════════════════════════════════════════╣
          ║ DATES                                                          ║
          ╠════════════════════════════════════════════════════════════════╣
          ║ Created:  ${{ steps['get-repo'].output.body.created_at }}
          ║ Updated:  ${{ steps['get-repo'].output.body.updated_at }}
          ║ Pushed:   ${{ steps['get-repo'].output.body.pushed_at }}
          ╚════════════════════════════════════════════════════════════════╝
  
  output:
    text:
      # ========== OPTION 1: COMPACT SUMMARY ==========
      - title: 📋 Quick Summary
        content: |
          **${{ steps['get-repo'].output.body.full_name }}** (${{ steps['get-repo'].output.body.visibility }})
          
          📊 ${{ steps['get-repo'].output.body.stargazers_count }}⭐ | ${{ steps['get-repo'].output.body.forks_count }}🍴 | ${{ steps['get-repo'].output.body.open_issues_count }}🐛 | ${{ steps['get-repo'].output.body.watchers_count }}👁️
          
          🔗 ${{ steps['get-repo'].output.body.html_url }}
          📅 Created: ${{ steps['get-repo'].output.body.created_at }}
          🔄 Updated: ${{ steps['get-repo'].output.body.updated_at }}
      
      # ========== OPTION 2: FORMATTED KEY INFORMATION ==========
      - title: 📦 Repository Overview (Formatted)
        content: |
          📦 **Repository Information**
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Name:           ${{ steps['get-repo'].output.body.full_name }}
          Description:    ${{ steps['get-repo'].output.body.description || 'No description' }}
          Visibility:     ${{ steps['get-repo'].output.body.visibility }}
          Default Branch: ${{ steps['get-repo'].output.body.default_branch }}
          Language:       ${{ steps['get-repo'].output.body.language || 'Not detected' }}
          
          📊 **Statistics**
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ⭐ Stars:        ${{ steps['get-repo'].output.body.stargazers_count }}
          👁️  Watchers:     ${{ steps['get-repo'].output.body.watchers_count }}
          🍴 Forks:        ${{ steps['get-repo'].output.body.forks_count }}
          🐛 Open Issues:  ${{ steps['get-repo'].output.body.open_issues_count }}
          📦 Size:         ${{ steps['get-repo'].output.body.size }} KB
          
          📅 **Timestamps**
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Created:     ${{ steps['get-repo'].output.body.created_at }}
          Updated:     ${{ steps['get-repo'].output.body.updated_at }}
          Last Push:   ${{ steps['get-repo'].output.body.pushed_at }}
          
          🔗 **URLs**
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          GitHub:   ${{ steps['get-repo'].output.body.html_url }}
          Clone:    ${{ steps['get-repo'].output.body.clone_url }}
          API:      ${{ steps['get-repo'].output.body.url }}
          
          ⚙️ **Settings**
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Issues:        ${{ steps['get-repo'].output.body.has_issues }}
          Projects:      ${{ steps['get-repo'].output.body.has_projects }}
          Wiki:          ${{ steps['get-repo'].output.body.has_wiki }}
          Discussions:   ${{ steps['get-repo'].output.body.has_discussions }}
          Is Template:   ${{ steps['get-repo'].output.body.is_template }}
          Is Fork:       ${{ steps['get-repo'].output.body.fork }}
          Is Archived:   ${{ steps['get-repo'].output.body.archived }}
          
          🔐 **Permissions**
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Admin:    ${{ steps['get-repo'].output.body.permissions.admin }}
          Push:     ${{ steps['get-repo'].output.body.permissions.push }}
          Pull:     ${{ steps['get-repo'].output.body.permissions.pull }}
          Maintain: ${{ steps['get-repo'].output.body.permissions.maintain }}
          Triage:   ${{ steps['get-repo'].output.body.permissions.triage }}
      
      # ========== OPTION 3: MARKDOWN TABLES ==========
      - title: 📊 Repository Details (Markdown Tables)
        content: |
          # ${{ steps['get-repo'].output.body.full_name }}
          
          > ${{ steps['get-repo'].output.body.description || 'No description provided' }}
          
          ## Basic Information
          
          | Property | Value |
          |----------|-------|
          | **Name** | `${{ steps['get-repo'].output.body.name }}` |
          | **Owner** | ${{ steps['get-repo'].output.body.owner.login }} |
          | **Visibility** | ${{ steps['get-repo'].output.body.visibility }} |
          | **Default Branch** | `${{ steps['get-repo'].output.body.default_branch }}` |
          | **Language** | ${{ steps['get-repo'].output.body.language || 'Not detected' }} |
          | **License** | ${{ steps['get-repo'].output.body.license.name || 'No license' }} |
          
          ## Statistics
          
          | Metric | Count |
          |--------|-------|
          | ⭐ Stars | ${{ steps['get-repo'].output.body.stargazers_count }} |
          | 🍴 Forks | ${{ steps['get-repo'].output.body.forks_count }} |
          | 👁️ Watchers | ${{ steps['get-repo'].output.body.watchers_count }} |
          | 🐛 Open Issues | ${{ steps['get-repo'].output.body.open_issues_count }} |
          | 📦 Size | ${{ steps['get-repo'].output.body.size }} KB |
          
          ## Timestamps
          
          | Event | Date |
          |-------|------|
          | Created | ${{ steps['get-repo'].output.body.created_at }} |
          | Updated | ${{ steps['get-repo'].output.body.updated_at }} |
          | Last Push | ${{ steps['get-repo'].output.body.pushed_at }} |
          
          ## Links
          
          - 🌐 [View on GitHub](${{ steps['get-repo'].output.body.html_url }})
          - 📋 [Clone URL](${{ steps['get-repo'].output.body.clone_url }})
          - 🔌 [API Endpoint](${{ steps['get-repo'].output.body.url }})
          
          ## Features
          
          - ${{ steps['get-repo'].output.body.has_issues && '✅' || '❌' }} Issues
          - ${{ steps['get-repo'].output.body.has_projects && '✅' || '❌' }} Projects
          - ${{ steps['get-repo'].output.body.has_wiki && '✅' || '❌' }} Wiki
          - ${{ steps['get-repo'].output.body.has_discussions && '✅' || '❌' }} Discussions
          - ${{ steps['get-repo'].output.body.is_template && '✅' || '❌' }} Template Repository
      
      # ========== OPTION 4: BOX FORMAT (Check Logs) ==========
      - title: 📦 Box Format Output
        content: |
          See logs for box-formatted output (check the debug:log step)
      
      # ========== RAW JSON OUTPUTS ==========
      - title: 1. Repository Details (Raw JSON)
        content: |
          ${{ steps['get-repo'].output.body | dump(4) }}
      
      - title: 2. Branches (Raw JSON)
        content: |
          ${{ steps['get-branches'].output.body | dump(4) }}
      
      - title: 3. Languages (Raw JSON)
        content: |
          ${{ steps['get-languages'].output.body | dump(4) }}
      
      - title: 4. Contributors (Raw JSON)
        content: |
          ${{ steps['get-contributors'].output.body | dump(4) }}
      
      - title: 5. Recent Commits (Raw JSON)
        content: |
          ${{ steps['get-commits'].output.body | dump(4) }}
      
      - title: 6. Tags (Raw JSON)
        content: |
          ${{ steps['get-tags'].output.body | dump(4) }}
      
      - title: 7. Releases (Raw JSON)
        content: |
          ${{ steps['get-releases'].output.body | dump(4) }}
      
      - title: 8. Pull Requests (Raw JSON)
        content: |
          ${{ steps['get-pulls'].output.body | dump(4) }}
      
      - title: 9. Issues (Raw JSON)
        content: |
          ${{ steps['get-issues'].output.body | dump(4) }}
      
      - title: 10. Topics (Raw JSON)
        content: |
          ${{ steps['get-topics'].output.body | dump(4) }}
      
      - title: 11. README (Raw JSON)
        content: |
          ${{ steps['get-readme'].output.body | dump(4) }}
