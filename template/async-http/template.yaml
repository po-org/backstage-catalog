apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: auto-api-call-tracker
  title: Automated API Call with Job Tracking
  description: Automatically make API calls configured in app-config.yaml
spec:
  owner: user:default/c-nell
  type: service
  
  steps:
    - id: make-api-call
      name: Execute API Call
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/httpbin/delay/5
        headers:
          content-type: "application/json"
    
    - id: log-response
      name: Log API Response
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          🎯 API CALL COMPLETED
          ═══════════════════════════════════════════════════════
          
          📍 Request:
             • Method: GET
             • Path: /proxy/httpbin/delay/5
             • Status: ${{ steps['make-api-call'].output.code }}
          
          📊 Response Body:
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
          📥 Response Headers:
          ${{ steps['make-api-call'].output.headers | dump(2) }}
          
          ═══════════════════════════════════════════════════════
    
    - id: create-catalog-component
      name: Register Component
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: api-job-auto-${{ "" | now | replace(":", "-") | replace(".", "-") | lower }}
            description: Automated API call to httpbin delay endpoint
            annotations:
              backstage.io/managed-by-location: 'url:generated'
              api.backstage.io/method: GET
              api.backstage.io/path: /proxy/httpbin/delay/5
              api.backstage.io/status-code: '${{ steps["make-api-call"].output.code }}'
              api.backstage.io/executed-at: ${{ "" | now }}
            tags:
              - api-call
              - automated
              - scheduled
          spec:
            type: service
            lifecycle: experimental
            owner: user:default/c-nell
  
  output:
    links:
      - title: 📋 View Component
        url: ${{ steps['create-catalog-component'].output.entityRef }}
    
    text:
      - title: ✅ API Call Summary
        content: |
          Automated API call completed successfully!
          
          🔗 Endpoint: GET /proxy/httpbin/delay/5
          📡 Status Code: ${{ steps['make-api-call'].output.code }}
          ⏰ Executed At: ${{ "" | now }}
          
      - title: 📦 Response Body
        content: |
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
      - title: 📥 Response Headers
        content: |
          ${{ steps['make-api-call'].output.headers | dump(2) }}
