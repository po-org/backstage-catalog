apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-multi-endpoint
  title: GitHub Repo - Multiple Endpoints
spec:
  owner: user:default/c-nell
  type: service
  
  parameters:
    - title: Repository
      required:
        - owner
        - repo
      properties:
        owner:
          title: Owner
          type: string
          default: po-org
        repo:
          title: Repository
          type: string
          default: backstage-catalog
  
  steps:
    # Repository Details
    - id: get-repo
      name: Get Repository Details
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}
    
    # Branches
    - id: get-branches
      name: Get Branches
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/branches
    
    # Languages
    - id: get-languages
      name: Get Languages
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/languages
    
    # Contributors
    - id: get-contributors
      name: Get Contributors
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/contributors
    
    # Recent Commits
    - id: get-commits
      name: Get Recent Commits
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/commits?per_page=10
    
    # Tags
    - id: get-tags
      name: Get Tags
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/tags
    
    # Releases
    - id: get-releases
      name: Get Releases
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/releases
    
    # Pull Requests
    - id: get-pulls
      name: Get Pull Requests
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/pulls?state=all&per_page=10
    
    # Issues
    - id: get-issues
      name: Get Issues
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/issues?state=all&per_page=10
    
    # Topics
    - id: get-topics
      name: Get Topics
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/topics
        headers:
          Accept: application/vnd.github.mercy-preview+json
    
    # README
    - id: get-readme
      name: Get README
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/${{ parameters.owner }}/${{ parameters.repo }}/readme
  
  output:
    text:
      - title: 1. Repository Details
        content: |
          ${{ steps['get-repo'].output.body | dump(4) }}
      
      - title: 2. Branches
        content: |
          ${{ steps['get-branches'].output.body | dump(4) }}
      
      - title: 3. Languages
        content: |
          ${{ steps['get-languages'].output.body | dump(4) }}
      
      - title: 4. Contributors
        content: |
          ${{ steps['get-contributors'].output.body | dump(4) }}
      
      - title: 5. Recent Commits
        content: |
          ${{ steps['get-commits'].output.body | dump(4) }}
      
      - title: 6. Tags
        content: |
          ${{ steps['get-tags'].output.body | dump(4) }}
      
      - title: 7. Releases
        content: |
          ${{ steps['get-releases'].output.body | dump(4) }}
      
      - title: 8. Pull Requests
        content: |
          ${{ steps['get-pulls'].output.body | dump(4) }}
      
      - title: 9. Issues
        content: |
          ${{ steps['get-issues'].output.body | dump(4) }}
      
      - title: 10. Topics
        content: |
          ${{ steps['get-topics'].output.body | dump(4) }}
      
      - title: 11. README
        content: |
          ${{ steps['get-readme'].output.body | dump(4) }}
