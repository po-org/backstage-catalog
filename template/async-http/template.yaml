apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: generic-api-call-tracker
  title: Generic API Call with Job Tracking
  description: Make any API call and track it as a component in Backstage
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: Job Configuration
      required:
        - jobName
      properties:
        jobName:
          title: Job Name
          type: string
          description: Name for this API call job
          
    - title: API Request Details
      required:
        - httpMethod
        - apiPath
      properties:
        httpMethod:
          title: HTTP Method
          type: string
          enum: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
          default: GET
          
        apiPath:
          title: API Path
          type: string
          description: 'Path to API endpoint (e.g., /proxy/httpbin/get or /api/v1/resource)'
          
        requestBody:
          title: Request Body (JSON)
          type: string
          description: JSON body for POST/PUT/PATCH requests (leave empty for GET/DELETE)
          ui:widget: textarea
          ui:options:
            rows: 5
            
    - title: Tracking Options
      properties:
        createComponent:
          title: Create Catalog Component
          type: boolean
          default: true
          description: Register this API call as a component in Backstage
          
        componentOwner:
          title: Component Owner
          type: string
          default: user:default/c-nell
  
  steps:
    - id: make-api-call
      name: Execute API Call
      action: http:backstage:request
      input:
        method: ${{ parameters.httpMethod }}
        path: ${{ parameters.apiPath }}
        headers:
          content-type: "application/json"
        body: ${{ parameters.requestBody }}
    
    - id: log-response
      name: Log API Response
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          🎯 API CALL COMPLETED
          ═══════════════════════════════════════════════════════
          
          📍 Request:
             • Method: ${{ parameters.httpMethod }}
             • Path: ${{ parameters.apiPath }}
             • Status: ${{ steps['make-api-call'].output.code }}
          
          📊 Response Body:
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
          📥 Response Headers:
          ${{ steps['make-api-call'].output.headers | dump(2) }}
          
          ═══════════════════════════════════════════════════════
    
    - id: create-catalog-component
      name: Register Component
      if: ${{ parameters.createComponent }}
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: api-job-${{ parameters.jobName | replace(" ", "-") | lower }}
            description: API call to ${{ parameters.httpMethod }} ${{ parameters.apiPath }}
            annotations:
              backstage.io/managed-by-location: 'url:generated'
              api.backstage.io/method: ${{ parameters.httpMethod }}
              api.backstage.io/path: ${{ parameters.apiPath }}
              api.backstage.io/status-code: '${{ steps["make-api-call"].output.code }}'
              api.backstage.io/executed-at: ${{ "" | now }}
            tags:
              - api-call
              - automated
              - ${{ parameters.httpMethod | lower }}
          spec:
            type: service
            lifecycle: experimental
            owner: ${{ parameters.componentOwner }}
  
  output:
    links:
      - title: 📋 View Component
        url: ${{ steps['create-catalog-component'].output.entityRef }}
    
    text:
      - title: ✅ API Call Summary
        content: |
          Job "${{ parameters.jobName }}" completed successfully!
          
          🔗 Endpoint: ${{ parameters.httpMethod }} ${{ parameters.apiPath }}
          📡 Status Code: ${{ steps['make-api-call'].output.code }}
          
      - title: 📦 Response Body
        content: |
          ${{ steps['make-api-call'].output.body | dump(2) }}
          
      - title: 📥 Response Headers
        content: |
          ${{ steps['make-api-call'].output.headers | dump(2) }}
