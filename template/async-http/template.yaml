apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: po-org-backstage-catalog-dump
  title: PO-Org Backstage Catalog API Dump
spec:
  owner: user:default/c-nell
  type: service
  
  steps:
    - id: call
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/repos/po-org/backstage-catalog
    
    - id: log
      action: debug:log
      input:
        message: |
          ═══════════════════════════════════════════════════════
          REPO: po-org/backstage-catalog
          ═══════════════════════════════════════════════════════
          
          ${{ steps['call'].output | dump(2) }}
  
  output:
    text:
      - title: Complete Output
        content: |
          ${{ steps['call'].output | dump(2) }}
