apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-job-tracking-httpbin
  title: Test Job Tracking (httpbin)
  description: Test async job tracking with httpbin delay endpoint
spec:
  owner: user:default/c-nell
  type: service
  parameters:
    - title: Test Configuration
      required:
        - testName
      properties:
        testName:
          title: Test Job Name
          type: string
          default: my-test-job
        
        delaySeconds:
          title: Job Duration (seconds)
          type: number
          default: 10
          enum: [5, 10, 20, 30]
  
  steps:
    - id: launch-test-job
      name: Launch Test Job
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/httpbin/delay/${{ parameters.delaySeconds }}
        headers:
          content-type: "application/json"
    
    - id: log-job-response
      name: Log Full Response
      action: debug:log
      input:
        message: |
          Job completed!
          Status: ${{ steps['launch-test-job'].output.code }}
          Headers: ${{ steps['launch-test-job'].output.headers | dump }}
          Body: ${{ steps['launch-test-job'].output.body | dump }}
    
    # Create catalog-info.yaml content
    - id: create-catalog-info
      name: Create Catalog Info
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: test-job-${{ parameters.testName | replace(" ", "-") | lower }}
            description: Test job tracking component
            annotations:
              backstage.io/managed-by-location: 'url:http://example.com/catalog-info.yaml'
              poll.backstage.io/enabled: 'true'
              poll.backstage.io/url: https://httpbin.org/uuid
              poll.backstage.io/status-path: 'uuid'
              poll.backstage.io/status: 'success'
              poll.backstage.io/completed-at: ${{ "" | now }}
            tags:
              - test
              - job-tracking
          spec:
            type: service
            lifecycle: experimental
            owner: user:default/c-nell
            system: test-system
  
  output:
    links:
      - title: View Component
        url: ${{ steps['create-catalog-info'].output.entityRef }}
    text:
      - title: Job Response
        content: |
          HTTP Status: ${{ steps['launch-test-job'].output.code }}
          Response Body: ${{ steps['launch-test-job'].output.body | dump }}
