apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: additional-features-showcase
  title: 🎯 Additional features Showcase Template
  description: Demonstrates all the additional UI features that were missing from the previous example
  tags:
    - showcase
    - complete-features
    - ui-options
spec:
  owner: user:default/c-nell
  type: service
  
  # Custom button labels
  presentation:
    buttonLabels:
      backButtonText: '← Go Back'
      createButtonText: '🚀 Deploy Now'
      reviewButtonText: '👀 Review Configuration'
  
  parameters:
    # ========================================
    # PAGE 1: PLACEHOLDER & AUTOCOMPLETE
    # ========================================
    - title: Text Input Features
      description: Placeholder text and autocomplete examples
      properties:
        username:
          title: Username
          type: string
          description: Choose your username
          ui:placeholder: 'enter-your-username'
          ui:autofocus: true
          ui:help: 'Username will be used for login'
          pattern: '^[a-z0-9-]+$'
          errorMessage:
            pattern: 'Username must be lowercase alphanumeric with hyphens only'
        
        firstName:
          title: First Name
          type: string
          description: Your first name
          ui:placeholder: 'John'
          ui:autocomplete: 'given-name'
          ui:emptyValue: ''
          ui:column: 6
        
        lastName:
          title: Last Name
          type: string
          description: Your last name
          ui:placeholder: 'Doe'
          ui:autocomplete: 'family-name'
          ui:emptyValue: ''
          ui:column: 6
        
        email:
          title: Email Address
          type: string
          description: Your email for notifications
          ui:placeholder: 'user@example.com'
          ui:autocomplete: 'email'
          format: email
          errorMessage:
            format: 'Please enter a valid email address'
        
        phoneNumber:
          title: Phone Number
          type: string
          description: Contact phone number
          ui:placeholder: '+1 (555) 123-4567'
          ui:options:
            inputType: tel
          ui:autocomplete: 'tel'
        
        website:
          title: Personal Website
          type: string
          description: Your website URL
          ui:placeholder: 'https://example.com'
          ui:autocomplete: 'url'
          ui:options:
            inputType: url

    # ========================================
    # PAGE 2: DISABLED & READONLY FIELDS
    # ========================================
    - title: Read-Only & Disabled Fields
      description: Fields that cannot be edited
      properties:
        generatedId:
          title: Generated ID
          type: string
          description: Auto-generated unique identifier
          default: 'auto-gen-12345-abcde'
          ui:readonly: true
          ui:help: 'This value is automatically generated and cannot be changed'
        
        systemValue:
          title: System Value
          type: string
          description: System-assigned value
          default: 'SYSTEM_ASSIGNED'
          ui:disabled: true
          ui:help: 'This field is disabled by the system'
        
        timestamp:
          title: Creation Timestamp
          type: string
          description: When this template was initiated
          default: '2025-12-19T20:00:00Z'
          ui:readonly: true
        
        editableField:
          title: Editable Field
          type: string
          description: This field can be edited
          default: 'You can change this'
          ui:placeholder: 'Enter custom value...'

    # ========================================
    # PAGE 3: MARKDOWN & HELP LINKS
    # ========================================
    - title: Rich Descriptions & Help Links
      description: Fields with markdown descriptions and help documentation
      properties:
        componentName:
          title: Component Name
          type: string
          description: |
            Name your component following these rules:
            
            **Requirements:**
            - Must be lowercase
            - Use hyphens for spaces
            - 3-50 characters
            
            **Examples:**
            - `my-awesome-component`
            - `user-management-service`
          ui:enableMarkdownInDescription: true
          ui:placeholder: 'my-component-name'
          pattern: '^[a-z0-9-]+$'
          minLength: 3
          maxLength: 50
        
        apiKey:
          title: API Key
          type: string
          description: Your API key for external service integration
          ui:help: 'Need an API key? Click the link below to get one'
          ui:helpLink: 'https://docs.example.com/getting-started/api-keys'
          ui:placeholder: 'sk_live_...'
          ui:field: Secret

        databaseUrl:
          title: Database Connection String
          type: string
          description: >
            Connection string format:
            postgresql://username:password@host:port/database
            See documentation for details.
          ui:enableMarkdownInDescription: true
          ui:help: 'Click the link for connection string format'
          ui:helpLink: 'https://www.postgresql.org/docs/current/libpq-connect.html'
          ui:placeholder: 'postgresql://user:pass@localhost:5432/mydb'

    # ========================================
    # PAGE 4: BACKSTAGE REVIEW OPTIONS
    # ========================================
    - title: Secret & Hidden Fields
      description: Fields that are masked or hidden in review
      properties:
        password:
          title: Password
          type: string
          description: Your secure password
          ui:field: Secret
          ui:placeholder: 'Enter a strong password'
          ui:backstage:
            review:
              mask: true
          ui:help: 'Password will be masked in the review step'
        
        privateToken:
          title: Private Token
          type: string
          description: Private access token
          ui:field: Secret
          ui:backstage:
            review:
              show: false
          ui:help: 'This field will not appear in the review step at all'
        
        internalConfig:
          title: Internal Configuration
          type: string
          description: Internal configuration that should not be reviewed
          default: '{"internal": "config"}'
          ui:widget: textarea
          ui:backstage:
            review:
              show: false
          ui:help: 'Hidden from review for security'

    # ========================================
    # PAGE 5: CUSTOM ERROR MESSAGES
    # ========================================
    - title: Custom Validation Messages
      description: Fields with custom error messages
      properties:
        projectName:
          title: Project Name
          type: string
          description: Name of your project
          pattern: '^[a-zA-Z][a-zA-Z0-9-]*$'
          minLength: 3
          maxLength: 30
          ui:placeholder: 'My-Project'
          errorMessage:
            pattern: 'Project name must start with a letter and contain only letters, numbers, and hyphens'
            minLength: 'Project name must be at least 3 characters long'
            maxLength: 'Project name cannot exceed 30 characters'
        
        version:
          title: Version Number
          type: string
          description: Semantic version (e.g., 1.0.0)
          pattern: '^\d+\.\d+\.\d+$'
          default: '1.0.0'
          ui:placeholder: '1.0.0'
          errorMessage:
            pattern: 'Version must follow semantic versioning format (e.g., 1.0.0)'
        
        port:
          title: Port Number
          type: integer
          description: Application port
          minimum: 1024
          maximum: 65535
          default: 8080
          ui:placeholder: '8080'
          errorMessage:
            minimum: 'Port must be at least 1024 (ports below 1024 require root privileges)'
            maximum: 'Port cannot exceed 65535 (maximum valid port number)'

    # ========================================
    # PAGE 6: COLUMN LAYOUT
    # ========================================
    - title: Multi-Column Layout
      description: Fields arranged in columns for better space utilization
      properties:
        region:
          title: Region
          type: string
          description: Deployment region
          enum:
            - us-east-1
            - us-west-2
            - eu-west-1
          default: us-east-1
          ui:column: 4
        
        environment:
          title: Environment
          type: string
          description: Deployment environment
          enum:
            - development
            - staging
            - production
          default: development
          ui:column: 4
        
        tier:
          title: Service Tier
          type: string
          description: Service tier
          enum:
            - free
            - standard
            - premium
          default: standard
          ui:column: 4
        
        cpuLimit:
          title: CPU Limit
          type: string
          description: CPU resource limit
          default: '500m'
          ui:placeholder: '500m'
          ui:column: 6
        
        memoryLimit:
          title: Memory Limit
          type: string
          description: Memory resource limit
          default: '512Mi'
          ui:placeholder: '512Mi'
          ui:column: 6
        
        minReplicas:
          title: Min Replicas
          type: integer
          description: Minimum pod replicas
          default: 1
          minimum: 1
          ui:column: 4
        
        maxReplicas:
          title: Max Replicas
          type: integer
          description: Maximum pod replicas
          default: 10
          minimum: 1
          ui:column: 4
        
        targetCpu:
          title: Target CPU %
          type: integer
          description: Target CPU utilization
          default: 80
          minimum: 1
          maximum: 100
          ui:column: 4

    # ========================================
    # PAGE 7: FIELD ORDERING
    # ========================================
    - title: Custom Field Order
      description: Fields displayed in a specific order
      ui:order:
        - priority
        - componentType
        - description
        - tags
        - notes
      properties:
        notes:
          title: Additional Notes
          type: string
          description: Any additional notes
          ui:widget: textarea
          ui:placeholder: 'Enter any additional information...'
        
        priority:
          title: Priority Level
          type: string
          description: How critical is this component
          enum:
            - critical
            - high
            - medium
            - low
          default: medium
          ui:widget: radio
        
        tags:
          title: Tags
          type: array
          description: Categorization tags
          items:
            type: string
          ui:placeholder: 'Add tags...'
        
        componentType:
          title: Component Type
          type: string
          description: Type of component
          enum:
            - service
            - library
            - website
          default: service
        
        description:
          title: Description
          type: string
          description: Brief description
          ui:widget: textarea
          ui:placeholder: 'Describe your component...'

    # ========================================
    # PAGE 8: EMPTY VALUE HANDLING
    # ========================================
    - title: Empty Value Behavior
      description: Control how empty values are handled
      properties:
        optionalField1:
          title: Optional Field (Empty String)
          type: string
          description: Optional field that defaults to empty string
          ui:emptyValue: ''
          ui:placeholder: 'Leave empty if not applicable'
        
        optionalField2:
          title: Optional Field (Null)
          type: string
          description: Optional field that can be null
          ui:placeholder: 'Optional value'
        
        requiredField:
          title: Required Field
          type: string
          description: This field must be filled
          ui:emptyValue: ''
          ui:placeholder: 'This field is required'
      required:
        - requiredField

  # ========================================
  # STEPS - REQUIRED SECTION
  # ========================================
  steps:
    - id: log_all_features
      name: Log All Feature Values
      action: debug:log
      input:
        message: |
          🎯 MISSING FEATURES SHOWCASE - SUBMITTED VALUES
          
          === Text Inputs with Placeholders ===
          Username: ${{ parameters.username }}
          First Name: ${{ parameters.firstName }}
          Last Name: ${{ parameters.lastName }}
          Email: ${{ parameters.email }}
          Phone: ${{ parameters.phoneNumber }}
          Website: ${{ parameters.website }}
          
          === Read-Only/Disabled Fields ===
          Generated ID: ${{ parameters.generatedId }}
          System Value: ${{ parameters.systemValue }}
          Timestamp: ${{ parameters.timestamp }}
          Editable: ${{ parameters.editableField }}
          
          === Markdown & Help Links ===
          Component Name: ${{ parameters.componentName }}
          Database URL: ${{ parameters.databaseUrl }}
          
          === Validation with Custom Errors ===
          Project Name: ${{ parameters.projectName }}
          Version: ${{ parameters.version }}
          Port: ${{ parameters.port }}
          
          === Multi-Column Layout ===
          Region: ${{ parameters.region }}
          Environment: ${{ parameters.environment }}
          Tier: ${{ parameters.tier }}
          CPU: ${{ parameters.cpuLimit }}
          Memory: ${{ parameters.memoryLimit }}
          Replicas: ${{ parameters.minReplicas }}-${{ parameters.maxReplicas }}
          Target CPU: ${{ parameters.targetCpu }}%
          
          === Custom Field Order ===
          Priority: ${{ parameters.priority }}
          Type: ${{ parameters.componentType }}
          Description: ${{ parameters.description }}
          Tags: ${{ parameters.tags }}
          Notes: ${{ parameters.notes }}
          
          === Empty Value Handling ===
          Optional 1: "${{ parameters.optionalField1 }}"
          Optional 2: "${{ parameters.optionalField2 }}"
          Required: "${{ parameters.requiredField }}"
    
    - id: log_secrets_note
      name: Note About Secrets
      action: debug:log
      input:
        message: |
          🔐 SECRETS HANDLING
          
          Note: Fields marked with ui:field: Secret are accessed via:
          - ${{ secrets.apiKey }}
          - ${{ secrets.password }}
          - ${{ secrets.privateToken }}
          
          These values are automatically masked in logs and the review step.
    
    - id: log_presentation
      name: Log Presentation Config
      action: debug:log
      input:
        message: |
          🎨 PRESENTATION CUSTOMIZATION
          
          Custom Button Labels:
          - Back Button: "← Go Back"
          - Create Button: "🚀 Deploy Now"
          - Review Button: "👀 Review Configuration"

  # ========================================
  # OUTPUT
  # ========================================
  output:
    links:
      - title: 📚 Backstage Documentation
        url: https://backstage.io/docs/features/software-templates/writing-templates
      - title: 🎨 JSON Schema Form Playground
        url: https://rjsf-team.github.io/react-jsonschema-form/
    text:
      - title: Template Completed
        content: |
          Successfully demonstrated all missing UI features!
          
          Key features showcased:
          ✅ ui:placeholder
          ✅ ui:emptyValue
          ✅ ui:autocomplete
          ✅ ui:disabled & ui:readonly
          ✅ ui:enableMarkdownInDescription
          ✅ ui:helpLink
          ✅ ui:backstage (review masking)
          ✅ ui:column (multi-column layout)
          ✅ ui:order (custom field ordering)
          ✅ errorMessage (custom validation)
          ✅ presentation.buttonLabels
      - title: Component Name
        content: ${{ parameters.componentName }}
      - title: Project Name
        content: ${{ parameters.projectName }}
